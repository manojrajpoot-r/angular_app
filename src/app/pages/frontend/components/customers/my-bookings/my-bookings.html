<div class="container mt-4">

  <h3 class="mb-4 fw-bold">💇 My Bookings</h3>

  @if(bookings.length === 0){
    <div class="alert alert-info">
      You have no bookings yet.
    </div>
  }
  @else {

    <div class="row">

      @for(item of bookings; track item.id){

        <div class="col-md-6 mb-3">

          <div class="card booking-card shadow-sm border-0">

            <div class="card-body">

              <div class="d-flex justify-content-between align-items-center">

                <h5 class="mb-0">
                  Booking #{{ item.id }}
                </h5>

                <span class="badge bg-secondary">
                  {{ item.bookingDate }}
                </span>

              </div>

              <hr>

              <p class="mb-1">
                ⏰ <strong>Time:</strong> {{ item.bookingTime }}
              </p>

              <p class="mb-1">
                💰 <strong>Amount:</strong> ₹{{ item.totalAmount }}
              </p>

              <div class="mt-2">

                <span class="badge status-badge status-{{item.bookingStatus}}">
                  {{ item.bookingStatus }}
                </span>

                <span class="badge status-badge status-{{item.paymentStatus}}">
                  {{ item.paymentStatus }}
                </span>

              </div>

              <div class="mt-3">
                <button class="btn btn-primary btn-sm"
               [routerLink]="['/booking-details', item.id]">
                  View Details
                </button>

              </div>

            </div>

          </div>

        </div>

      }

    </div>

  }

</div>
