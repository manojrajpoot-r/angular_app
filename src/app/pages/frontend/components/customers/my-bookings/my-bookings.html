<div class="container mt-4">

  <h3 class="mb-4 fw-bold">💇 My Bookings</h3>

  @if(bookings.length === 0){
    <div class="alert alert-info">
      You have no bookings yet.
    </div>
  }
  @else {

    <div class="row">

      @for(item of bookings; track item.id){

     <div class="card booking-card border-0 shadow-sm h-100">
        <div class="card-body">

          <div class="d-flex justify-content-between align-items-center">
            <div>
              <h5 class="fw-bold mb-1">
                Booking #{{ item.id }}
              </h5>

              <small class="text-muted">
                {{ item.bookingDate }}
              </small>
            </div>

            <span class="badge rounded-pill bg-success">
              {{ item.bookingStatus }}
            </span>
          </div>

          <hr>

          <p class="mb-2">
            ⏰ {{ item.bookingTime }}
          </p>

          <p class="mb-2">
            💰 ₹{{ item.totalAmount }}
          </p>

          <p class="mb-3">
            💳 {{ item.paymentStatus }}
          </p>

          <a
            [routerLink]="['/booking-details', item.id]"
            class="btn btn-dark w-100">
            View Details
          </a>

        </div>
      </div>


      }

    </div>

  }

</div>
