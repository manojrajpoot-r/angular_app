<div class="card h-100 shadow-sm border-0 position-relative">

  <!-- Wishlist Button -->
  <button
    class="btn btn-light position-absolute top-0 end-0 m-2 rounded-circle shadow-sm">

<i
  class="bi"
  [ngClass]="product.isWishlist ? 'bi-heart-fill text-danger' : 'bi-heart'">
</i>

  </button>

  <!-- Discount Badge -->
  <span *ngIf="product.discountPrice" class="badge bg-danger position-absolute top-0 start-0 m-2">

    {{
      product.discountPercentage
    }}% OFF

  </span>

  <!-- Product Image -->
  <img
    [src]="product.image"
    class="card-img-top p-3"
    height="250"
    style="object-fit: contain;">

  <div class="card-body d-flex flex-column">

    <h5 class="fw-bold">
      {{ product.name }}
    </h5>

    <p class="text-muted small flex-grow-1">
      {{ product.shortDescription }}
    </p>

    <!-- Price -->
    <div class="d-flex align-items-center gap-2">

      <h5 class="text-danger mb-0">

        ₹{{ product.discountPrice || product.price }}

      </h5>

      <del
        *ngIf="product.discountPrice"
        class="text-muted">

        ₹{{ product.price }}

      </del>

    </div>

    <!-- Add To Cart -->
 <button
  class="btn btn-dark w-100 mt-3"
  (click)="addToCart(product.id)">

  Add To Cart

</button>

  </div>

</div>
