<div class="card h-100 shadow border-0 rounded-4 overflow-hidden product-card">

  <!-- Wishlist -->
  <button
    class="btn btn-light position-absolute top-0 end-0 m-3 rounded-circle shadow-sm z-3"
    (click)="addToWishlist(product.id)">

    <i
      class="bi"
      [ngClass]="
        isWishlist
          ? 'bi-heart-fill text-danger'
          : 'bi-heart'
      ">
    </i>

  </button>

  <!-- Discount -->
  <span
    *ngIf="product.discountPercentage"
    class="badge bg-danger position-absolute top-0 start-0 m-3 z-3">

    {{ product.discountPercentage }}% OFF

  </span>

  <!-- IMAGE -->

  <a [routerLink]="['/product', product.slug]">

    <img
      [src]="imageBaseUrl + '/' + product.image"
      class="card-img-top p-4"
      height="260"
      style="object-fit: contain;">

  </a>

  <!-- BODY -->

  <div class="card-body d-flex flex-column">

    <h5 class="fw-bold">
      {{ product.name }}
    </h5>

    <p class="text-muted small flex-grow-1">
      {{ product.shortDescription }}
    </p>

    <!-- PRICE -->

    <div class="d-flex align-items-center gap-2">

      <h5 class="text-dark fw-bold mb-0">

        ₹{{ product.discountPrice || product.price }}

      </h5>

      <del
        *ngIf="product.discountPrice"
        class="text-muted">

        ₹{{ product.price }}

      </del>

    </div>

    <!-- BUTTON -->

    <button
      class="btn btn-dark rounded-pill w-100 mt-4"
      (click)="addToCart(product.id)">

      Add To Cart

    </button>

  </div>

</div>


<button
  *ngIf="showWishlistRemove"
  class="btn btn-danger w-100 mt-2"
  (click)="removeWishlist(product.id)">

  Remove Wishlist

</button>
