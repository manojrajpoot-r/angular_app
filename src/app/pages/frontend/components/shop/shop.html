<div class="container py-5">

  <div class="row">

    <!-- SIDEBAR -->

    <div class="col-lg-3">

      <div class="bg-white shadow rounded-4 p-4">

        <h4 class="fw-bold mb-4">
          Filters
        </h4>

        <!-- SEARCH -->

        <div class="input-group">
          <input
            type="text"
            class="form-control"
            [(ngModel)]="search"
            placeholder="Search...">
          <button
            class="btn btn-dark"
            (click)="onSearch()">
            Search
          </button>
        </div>








        <!-- CATEGORY -->
        <div class="mb-4">
          <h6 class="fw-bold">
            Categories
          </h6>
          <div class="filter-scroll">
            <div *ngFor="let category of categories">
              <input
                type="checkbox"
                [checked]="selectedCategories.includes(category.id)"
                (change)="onCategoryChange($event, category)">
                   {{ category.name }}
            </div>
          </div>
        </div>

        <!-- BRAND -->
        <div class="mb-4">
          <h6 class="fw-bold">
            Brands
          </h6>
        <div class="filter-scroll">
            <div *ngFor="let brand of brands">
              <input
                type="checkbox"
                [checked]="selectedBrands.includes(brand.id)"
                (change)="onBrandChange($event, brand)">
                {{ brand.name }}
            </div>
          </div>
        </div>
        <!-- PRICE -->
        <div class="mb-4">
          <h6 class="fw-bold">
            Price
          </h6>
          <input
            type="number"
            class="form-control mb-2"
            placeholder="Min"
            [(ngModel)]="minPrice">
          <input
            type="number"
            class="form-control mb-2"
            placeholder="Max"
            [(ngModel)]="maxPrice">
          <button
            class="btn btn-dark w-100"
            (click)="applyPriceFilter()">
            Apply
          </button>
        </div>
        <button
          class="btn btn-outline-secondary w-100 mt-2"
          (click)="resetAllFilters()">
          Reset Filters
        </button>
      </div>
    </div>

    <!-- PRODUCTS -->
    <div class="col-lg-9">
      <!-- TOP BAR -->
      <div
        class="d-flex justify-content-between align-items-center mb-4">
       <h4 class="fw-bold display-6">
          {{ selectedFilterName }}
        </h4>
        <p class="text-muted">
          Showing {{ products.length }} Products
        </p>
        <select
          class="form-select w-auto"
          [(ngModel)]="sortBy"
          (change)="onSortChange()">

          <option value="">
            Sort By
          </option>

          <option value="latest">
            Latest
          </option>

          <option value="lowToHigh">
            Price Low To High
          </option>

          <option value="highToLow">
            Price High To Low
          </option>
        </select>
      </div>

           <!-- PREMIUM LOADER -->

      <div
        *ngIf="loading"
        class="text-center py-5">

        <div
          class="spinner-border text-dark"
          style="width: 4rem; height: 4rem;">
        </div>

        <h5 class="fw-bold mt-4">
          Loading Products...
        </h5>

      </div>


    <div class="row g-4" *ngIf="!loading">
      <div class="col-lg-4 col-md-6" *ngFor="let product of products;trackBy: trackByProduct">
        <app-product-card
          [product]="product">
        </app-product-card>
      </div>
    </div>
      <!-- PRODUCT GRID -->



      <div
        *ngIf="!loading && products.length === 0" class="text-center py-5">
        <h3 class="fw-bold">
          No Products Found
        </h3>
      </div>
      <!-- PAGINATION -->

      <div
        class="d-flex justify-content-center gap-3 mt-5">
        <button
          class="btn btn-outline-dark"
          [disabled]="pageNumber === 1"
          (click)="previousPage()">
          Previous
        </button>
        <span class="fw-bold pt-2">
          {{ pageNumber }}
        </span>
        <button
          class="btn btn-outline-dark"
          [disabled]="pageNumber === totalPages"
          (click)="nextPage()">
          Next
        </button>
      </div>

    </div>
  </div>
</div>
