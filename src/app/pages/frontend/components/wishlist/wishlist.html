

<section class="container mt-5">
      <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
          <h2 class="fw-bold mb-1">My Wishlist</h2>
          <p class="text-muted mb-0">
            Save your favorite products for later.
          </p>
        </div>

        <span class="badge bg-dark fs-6 px-3 py-2">
          {{ wishlistProducts.length }} Items
        </span>
      </div>
    <div *ngIf="wishlistProducts.length > 0; else emptyWishlist"></div>


        <div class="row">
          <div class="col-md-3 mb-4" *ngFor="let product of wishlistProducts">
            <app-product-card
              [product]="product"
              [showWishlistRemove]="true"
              (wishlistRemoved)="loadWishlist()">
            </app-product-card>
          </div>
        </div>

      <ng-template #emptyWishlist>

        <div class="text-center py-5">

          <img
            src="https://cdn-icons-png.flaticon.com/512/4555/4555971.png"
            width="180">

          <h3 class="fw-bold mt-4">
            Your Wishlist is Empty
          </h3>

          <p class="text-muted">
            Add products you love to your wishlist.
          </p>

          <button
            class="btn btn-dark rounded-pill px-4 py-2"
            routerLink="">

            Continue Shopping

          </button>

        </div>

      </ng-template>

</section>
