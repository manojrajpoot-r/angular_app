<app-form-wrapper-component [title]="isEdit ? 'Edit User' : 'Add User'">

<form [formGroup]="form" (ngSubmit)="saveUser()">



  <!-- Name -->
  <div class="mb-3">
    <label>Name</label>

    <input type="text" class="form-control" formControlName="name">

    <app-validation-error-component
      [control]="form.get('name')">
    </app-validation-error-component>
  </div>


  <!-- Name -->
  <div class="mb-3">
    <label>Email</label>

    <input type="text" class="form-control" formControlName="email">

    <app-validation-error-component
      [control]="form.get('email')">
    </app-validation-error-component>
  </div>

    <!-- Name -->
  <div class="mb-3">
    <label>Password</label>

  <input type="password" class="form-control" formControlName="password">

    <app-validation-error-component
      [control]="form.get('password')">
    </app-validation-error-component>
  </div>

  <!-- Buttons -->
  <div class="d-flex justify-content-between">

    <button type="button" class="btn btn-light"
      (click)="router.navigate(['/admin/users'])">
      Cancel
    </button>


     <app-submit-button-component
       type="submit"
       class="btn btn-primary"
      [loading]="loading"
      [text]="isEdit ? 'Update' : 'Save'">
     </app-submit-button-component>


  </div>

</form>
</app-form-wrapper-component>
