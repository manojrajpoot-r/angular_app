<app-form-wrapper-component
  [title]="isEditMode ? 'Edit User' : 'Add User'"
>

<form
  [formGroup]="form"
  (ngSubmit)="saveUser()"
>

  <!-- NAME -->

  <div class="mb-3">

    <label>Name</label>

    <input
      type="text"
      class="form-control"
      formControlName="name"
    >
<app-validation-error-component
  [control]="form.get('name')"
  label="Name"
/>
  </div>

  <!-- EMAIL -->

  <div class="mb-3">

    <label>Email</label>

    <input
      type="text"
      class="form-control"
      formControlName="email"
    >

<app-validation-error-component
  [control]="form.get('email')"
  label="Email"
/>
  </div>

  <!-- PASSWORD -->

  <div class="mb-3">

    <label>Password</label>

    <input
      type="password"
      class="form-control"
      formControlName="password"
    >
    <app-validation-error-component
      [control]="form.get('password')"
      label="Password"
    />
      </div>

  <!-- BUTTONS -->




            <div
              class="d-flex justify-content-center gap-3">
              <app-submit-button-component
                type="submit"
                [loading]="loading"
                [text]="isEditMode ? 'Update' : 'Add'">
              </app-submit-button-component>

                 <button
                type="button" (click)="router.navigate(['admin/users'])"
                class="btn btn-light border px-5 rounded-pill">
                Cancel
              </button>

            </div>

</form>

</app-form-wrapper-component>
