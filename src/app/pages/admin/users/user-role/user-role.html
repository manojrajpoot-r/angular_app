<div class="container-fluid py-4">

  <div class="card border-0 shadow-lg rounded-4 overflow-hidden">

    <div class="card-header bg-white border-0 p-4">

      <div class="d-flex justify-content-between align-items-center flex-wrap gap-3">

        <div>

          <h3 class="fw-bold mb-1">

            <i class="bi bi-people-fill text-primary me-2"></i>

            User Role Management

          </h3>

          <p class="text-muted mb-0">

            Assign multiple roles to selected user

          </p>

        </div>

        <div class="bg-light px-4 py-2 rounded-3 border">

          <span class="text-muted small d-block">
            Selected User
          </span>

          <span class="fw-bold fs-5 text-dark">
            {{ userName }}
          </span>

        </div>

      </div>

    </div>

    <div class="card-body p-4">

    <div *ngIf="loading && roles.length == 0" class="text-center py-5">

        <div class="spinner-border text-primary mb-3"></div>

        <p class="text-muted mb-0">
          Loading roles...
        </p>

      </div>

      <div *ngIf="!loading && roles.length > 0">

        <div class="card border-0 shadow-sm rounded-4">

          <div class="card-header bg-light border-0 py-3 px-4">

            <div class="d-flex justify-content-between align-items-center">

              <h5 class="fw-bold mb-0 text-dark">

                <i class="bi bi-person-badge-fill text-warning me-2"></i>

                Available Roles

              </h5>

              <div class="form-check form-switch">

                <input
                  class="form-check-input"
                  type="checkbox"
                  [checked]="isAllSelected()"
                  (change)="toggleAll($event)">

                <label class="form-check-label fw-semibold">

                  Check All

                </label>

              </div>

            </div>

          </div>

          <div class="card-body p-4">

            <div class="row g-3">

              <div
                class="col-md-6 col-lg-4"
                *ngFor="let item of roles">

                <div class="border rounded-4 p-3 h-100 permission-box">

                  <div class="form-check d-flex align-items-center gap-2">

                    <input
                      class="form-check-input custom-checkbox"
                      type="checkbox"
                      [(ngModel)]="item.checked"
                      [id]="'role_' + item.id">

                    <label
                      class="form-check-label fw-semibold text-dark w-100 cursor-pointer"
                      [for]="'role_' + item.id">

                      {{ item.name }}

                    </label>

                  </div>

                </div>

              </div>

            </div>

          </div>

        </div>

        <div class="text-end mt-4">

          <button
            class="btn btn-primary btn-lg px-5 rounded-4 shadow-sm"
            (click)="saveRoles()">

            <i class="bi bi-check2-circle me-2"></i>

            Save Roles

          </button>

        </div>

      </div>

      <div *ngIf="!loading && roles.length == 0"
           class="text-center py-5 text-muted">

        No Roles Found

      </div>

    </div>

  </div>

</div>
