<div class="card shadow border-0">

  <!-- Header -->
  <div class="card-header bg-white d-flex justify-content-between align-items-center">
    <h5 class="mb-0 fw-semibold">Users</h5>


    <button *ngIf="permissionAuth.hasPermission('add_user')" class="btn btn-primary btn-sm" (click)="goToAdd()">
      + Add User
    </button>
  </div>

  <!-- Search -->
  <div class="p-3 border-bottom">
    <div class="input-group">
      <span class="input-group-text bg-white">
        🔍
      </span>
      <input type="text"
             class="form-control"
             placeholder="Search users..."
             (keyup)="onSearch($event.target.value)">
    </div>
  </div>

  <!-- Table -->
  <div class="table-responsive">
    <table class="table align-middle mb-0 table-hover">

      <thead class="table-light sticky-top">
        <tr>
          <th>#</th>
          <th (click)="sort('name')" style="cursor:pointer">
            Name ⬍
          </th>
          <th (click)="sort('email')" style="cursor:pointer">
            Email ⬍
          </th>
          <th class="text-center">Action</th>
        </tr>
      </thead>

      <tbody>

        <!-- Loader -->
        <tr *ngIf="loading">
          <td colspan="4" class="text-center py-4">
            <div class="spinner-border text-primary"></div>
          </td>
        </tr>

        <!-- Data -->
        <tr *ngFor="let u of users">
          <td>{{u.id}}</td>
          <td class="fw-medium">{{u.name}}</td>
          <td>{{u.email}}</td>

          <td class="text-center">
            <button *ngIf="permissionAuth.hasPermission('edit_user')"
              class="btn btn-sm btn-outline-primary me-2"
              title="Edit"
              (click)="editUser(u.id)">
               <i class="bi bi-pencil"></i>
            </button>

          <button *ngIf="permissionAuth.hasPermission('assign_roles')"
            class="btn btn-sm btn-primary rounded-3"
            title="Assign Roles"
            (click)="manageUserRole(u.id)">
            <i class="bi bi-person-gear me-1"></i>
          </button>

            <button *ngIf="permissionAuth.hasPermission('delete_user')"
              class="btn btn-sm btn-outline-danger"
              title="Delete"
              (click)="deleteUser(u.id)">
             <i class="bi bi-trash-fill"></i>
            </button>

          </td>
        </tr>

        <!-- No Data -->
        <tr *ngIf="!loading && users.length === 0">
          <td colspan="4" class="text-center text-muted py-4">
            🚫 No users found
          </td>
        </tr>

      </tbody>
    </table>
  </div>

  <!-- Footer -->
  <div class="card-footer d-flex justify-content-between align-items-center">

    <!-- Records Info -->
    <small class="text-muted">
      Showing {{users.length}} of {{totalRecords}} records
    </small>

    <!-- Pagination -->
    <app-pagination
      [totalRecords]="totalRecords"
      [pageSize]="params.pageSize"
      [currentPage]="params.pageNumber"
      (pageChange)="changePage($event)">
    </app-pagination>

  </div>

</div>
