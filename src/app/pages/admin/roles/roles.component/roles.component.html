<div class="card shadow border-0">

  <!-- Header -->
  <div class="card-header bg-white d-flex justify-content-between align-items-center">
    <h5 class="mb-0 fw-semibold">Roles</h5>

    <button   *ngIf="permissionAuth.hasPermission('add_role')" class="btn btn-primary btn-sm" (click)="goToAdd()">
      + Add Role
    </button>
  </div>

  <!-- Search -->
  <div class="p-3 border-bottom">
    <div class="input-group">
      <span class="input-group-text bg-white">
        🔍
      </span>
      <input type="text"
             class="form-control"
             placeholder="Search roles..."
             (keyup)="onSearch($event.target.value)">
    </div>
  </div>

  <!-- Table -->
  <div class="table-responsive">
    <table class="table align-middle mb-0 table-hover">

      <thead class="table-light sticky-top">
        <tr>
          <th>#</th>
          <th (click)="sort('name')" style="cursor:pointer">
            Name ⬍
          </th>
          <th class="text-center">Action</th>
        </tr>
      </thead>

      <tbody>

        <!-- Loader -->
        <tr *ngIf="loading">
          <td colspan="4" class="text-center py-4">
            <div class="spinner-border text-primary"></div>
          </td>
        </tr>

        <!-- Data -->
        <tr *ngFor="let u of roles">
          <td>{{u.id}}</td>
          <td class="fw-medium">{{u.name}}</td>

          <td class="text-center">
         <button *ngIf="permissionAuth.hasPermission('edit_role')"
            class="btn btn-sm btn-outline-primary me-2"
            title="Edit"
            (click)="editRole(u.id)">
            <i class="bi bi-pencil-square"></i>
          </button>

          <button *ngIf="permissionAuth.hasPermission('assign_permissions')"
            class="btn btn-sm btn-outline-warning me-2"
            title="Manage Permissions"
            (click)="managePermissions(u.id)">
            <i class="bi bi-shield-lock"></i>
          </button>

           <button *ngIf="permissionAuth.hasPermission('delete_role')"
              class="btn btn-sm btn-outline-danger"
              title="Delete"
              (click)="deleteRole(u.id)">
              <i class="bi bi-trash3"></i>
            </button>
          </td>
        </tr>

        <!-- No Data -->
        <tr *ngIf="!loading && roles.length === 0">
          <td colspan="4" class="text-center text-muted py-4">
            🚫 No roles found
          </td>
        </tr>

      </tbody>
    </table>
  </div>

  <!-- Footer -->
  <div class="card-footer d-flex justify-content-between align-items-center">

    <!-- Records Info -->
    <small class="text-muted">
      Showing {{roles.length}} of {{totalRecords}} records
    </small>

    <!-- Pagination -->
    <app-pagination
      [totalRecords]="totalRecords"
      [pageSize]="params.pageSize"
      [currentPage]="params.pageNumber"
      (pageChange)="changePage($event)">
    </app-pagination>

  </div>

</div>
