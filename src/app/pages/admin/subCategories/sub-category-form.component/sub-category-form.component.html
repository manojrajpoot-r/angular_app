<div class="card shadow-lg border-0 mt-4" style="max-width: 500px; margin:auto;">
  <div class="card-body">

    <h4 class="mb-4 text-center fw-bold">
      {{ isEdit ? 'Edit SubCategory' : 'Add SubCategory' }}
    </h4>

    <form (ngSubmit)="saveSubCategory()">

      <div class="mb-3">
        <label class="form-label">Name</label>
        <input type="text" class="form-control"
               [(ngModel)]="subcategory.name"
               name="name"
               required>
      </div>

       <div class="mb-3">
        <label class="form-label">Description</label>
        <input type="text" class="form-control"
               [(ngModel)]="subcategory.description"
               name="description"
               required>
      </div>
      <app-image-upload
        [multiple]="false"
        [imageUrls]="subcategory.image ? [subcategory.image] : []"
        (fileChange)="onFileSelected($event)">
      </app-image-upload>

      <div class="d-flex justify-content-between">

        <button type="button"
                class="btn btn-light"
                (click)="router.navigate(['/admin/subCategories'])">
          Cancel
        </button>

        <button type="submit" class="btn btn-primary shadow-sm">
          {{ isEdit ? 'Update' : 'Save' }}
        </button>

      </div>

    </form>

  </div>
</div>
