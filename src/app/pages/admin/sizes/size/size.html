<div class="container-fluid py-4">

  <!-- HEADER -->
  <div
    class="d-flex justify-content-between align-items-center mb-4">

    <div>
      <h3 class="fw-bold mb-1">Size Management</h3>

      <p class="text-muted mb-0">
        Manage product sizes professionally
      </p>
    </div>

    <button (click)="addSize()"
      class="btn btn-primary rounded-pill px-4 shadow-sm">
      <i class="bi bi-plus-circle me-2"></i>
      Add Size
    </button>

  </div>

  <!-- SEARCH -->
  <div class="card border-0 shadow-sm rounded-4 mb-4">

    <div class="card-body">

      <div class="row">

        <div class="col-md-4">

          <input
            type="text"
            class="form-control rounded-pill"
            placeholder="Search size..."
            (input)="onSearch($event)" />

        </div>

      </div>

    </div>

  </div>

  <!-- TABLE -->
  <div class="card border-0 shadow-sm rounded-4">

    <div class="card-body p-0">

      <div class="table-responsive">

        <table
          class="table align-middle table-hover mb-0">

          <thead class="table-light">

            <tr>

              <th>#</th>

              <th>Size</th>
              <th>Status</th>

              <th class="text-center">
                Actions
              </th>

            </tr>

          </thead>

          <tbody>

            <!-- LOADING -->
            <tr *ngIf="loading">

              <td colspan="6" class="text-center py-5">

                <div
                  class="spinner-border text-primary">

                </div>

              </td>

            </tr>

            <!-- NO DATA -->
            <tr
              *ngIf="!loading && sizes.length === 0">

              <td colspan="6"
                  class="text-center py-5 text-muted">

                No sizes found

              </td>

            </tr>

            <!-- DATA -->
            <tr
              *ngFor="
                let item of sizes;
                let i = index;
                trackBy: trackById
              ">

              <td>
                {{
                  ((pageNumber - 1) * pageSize) + i + 1
                }}
              </td>

              <td class="fw-semibold">
                {{ item.name }}
              </td>
              <td>

                <span
                  class="badge rounded-pill"
                  [ngClass]="
                    item.isActive
                    ? 'bg-success'
                    : 'bg-danger'
                  ">

                  {{
                    item.isActive
                    ? 'Active'
                    : 'Inactive'
                  }}

                </span>

              </td>

              <td>

                <div
                  class="d-flex justify-content-center gap-2">

                  <!-- EDIT -->
                  <button
                    class="btn btn-sm btn-outline-primary rounded-circle action-btn"
                    (click)="editSize(item.id)">

                    <i class="bi bi-pencil"></i>

                  </button>

                  <!-- DELETE -->
                  <button
                    class="btn btn-sm btn-outline-danger rounded-circle action-btn"
                    (click)="deleteSize(item.id)">

                    <i class="bi bi-trash"></i>

                  </button>

                  <!-- STATUS -->
                  <button
                    class="btn btn-sm rounded-circle action-btn"
                    [ngClass]="
                      item.isActive
                      ? 'btn-outline-warning'
                      : 'btn-outline-success'
                    "
                    (click)="changeStatus(item)">

                    <i
                      class="bi"
                      [ngClass]="
                        item.isActive
                        ? 'bi-eye-slash'
                        : 'bi-check-circle'
                      ">
                    </i>

                  </button>

                </div>

              </td>

            </tr>

          </tbody>

        </table>

      </div>

    </div>

  </div>

  <!-- PAGINATION -->
  <div class="mt-4">

    <app-pagination
      [totalRecords]="totalRecords"
      [pageSize]="pageSize"
      [currentPage]="pageNumber"
      (pageChange)="onPageChange($event)">
    </app-pagination>

  </div>

</div>
