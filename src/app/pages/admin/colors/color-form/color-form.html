<app-form-wrapper-component

          [title]="isEditMode ? 'Edit Color' : 'Add Color'">
          <div class="mb-4 text-center">

            <h3 class="fw-bold">

              {{
                isEditMode
                ? 'Update Color'
                : 'Add New Color'
              }}

            </h3>

            <p class="text-muted">

              Manage product colors professionally

            </p>

          </div>

          <!-- FORM -->
          <form
            [formGroup]="colorForm"
            (ngSubmit)="onSubmit()">

            <!-- NAME -->
            <div class="mb-4">

              <label class="form-label fw-semibold">

                Color Name

              </label>

              <input
                type="text"
                class="form-control premium-input"
                formControlName="name"
                placeholder="Enter color name" />

              <app-validation-error-component
                [control]="f['name']">
              </app-validation-error-component>

            </div>

            <!-- COLOR CODE -->
            <div class="mb-4">

              <label class="form-label fw-semibold">

                Color Code

              </label>

              <div class="d-flex gap-3 align-items-center">

                <input
                  type="color"
                  class="form-control form-control-color"
                  formControlName="code" />

                <input
                  type="text"
                  class="form-control premium-input"
                  formControlName="code"
                  placeholder="#000000" />

              </div>

              <app-validation-error-component
                [control]="f['code']">
              </app-validation-error-component>

            </div>

            <!-- PREVIEW -->
            <div class="mb-4 text-center">

              <div
                class="preview-box mx-auto"
                [style.background]="f['code'].value">

              </div>

            </div>

            <!-- BUTTONS -->
            <div
              class="d-flex justify-content-center gap-3">
              <app-submit-button-component
                type="submit"
                [loading]="loading"
                [text]="isEditMode ? 'Update' : 'Add'">
              </app-submit-button-component>

              <button
                type="button" (click)="router.navigate(['admin/colors'])"
                class="btn btn-light border px-5 rounded-pill">
                Cancel
              </button>
            </div>

          </form>

      </app-form-wrapper-component>
